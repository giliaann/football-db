services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./ddl_script.sql:/docker-entrypoint-initdb.d/01_scheme.sql:ro
      - data:/var/lib/postgresql/data
    healthcheck:
      # TCP, because the server that runs ddl_script.sql on first start listens only on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
  seeder:
    build: .
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      # Port inside the Docker network, independent of DB_PORT published on the host.
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
volumes:
  data:
